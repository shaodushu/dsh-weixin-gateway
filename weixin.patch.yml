# 微信网关 patch — 叠加在 headless profile 之上（仓库内开发版）。
#
# 用法：
#   dsh --profile headless --patch ./weixin.patch.yml --weixin-login   # 扫码登录
#   dsh --profile headless --patch ./weixin.patch.yml --weixin-run     # 常驻网关
#
# 机制：headless profile 通过 bundles 已加载发布版 dsh-weixin-gateway
# （cordis.patch.yml：headless-startup/runner 已禁用，weixin-startup/
# weixin-gateway 已插入）——发布版直接 `dsh --profile headless --weixin-run`
# 即可，无需本 patch。本 patch 用于开发者场景：禁用 bundle 的发布版插件，
# 替换为仓库内构建产物（lib/）。
#
# 注意：entry id 必须是新的——cordis patch 的 name 是匹配键不可覆盖，
# 同名 insert 会报 duplicate loader entry id（曾踩坑）；服务注入按服务名
# （weixinStartup）解析，与插件 id 无关。

- id: weixin-startup
  disabled: true

- id: weixin-gateway
  disabled: true

- insert:
    # 解析 --weixin-login / --weixin-run
    - id: weixin-startup-local
      name: '/Users/baymax/Code/weixin-dsh-gateway/lib/weixin/entry.js'
      inject: [cmdlineArgs]

    # 执行登录或常驻网关
    - id: weixin-gateway-local
      name: '/Users/baymax/Code/weixin-dsh-gateway/lib/weixin/gateway.js'
      inject: [weixinStartup, agentDefaultModel, agents, sessions]
      config:
        mode: !!js ctx.weixinStartup.mode
        accountId: !!js ctx.weixinStartup.accountId
        sessionMode: !!js ctx.weixinStartup.sessionMode ?? 'room'
